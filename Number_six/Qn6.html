<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Convert Celsius to Fahrenheit</h1>

  <label for="celsiusInput">Enter temperature in Celsius:</label>
  <input type="number" id="celsiusInput" placeholder="Celsius">

  <button onclick="convertToFahrenheit()">Convert to Fahrenheit</button>

  <p id="result"></p>

  <script>
    
    function convertToFahrenheit() {
      
      const celsius = parseFloat(document.getElementById("celsiusInput").value);

      
      if (isNaN(celsius)) {
        document.getElementById("result").textContent = "Please enter a valid number.";
        return;
      }

      
      const fahrenheit = (celsius * 9 / 5) + 32;

      
      document.getElementById("result").textContent = `${celsius}°C is equal to ${fahrenheit.toFixed(2)}°F`;
    }
  </script>

</body>
</html>
