<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12-hour to 24-hour Time Converter</title>
</head>
<body>

    <h2>12-hour to 24-hour Time Converter</h2>

    <label for="timeInput">Enter time (12-hour format, e.g., 02:30 PM):</label>
    <input type="text" id="timeInput" placeholder="e.g., 02:30 PM">
    <button onclick="convertTo24Hour()">Convert</button>

    <h3>24-hour format: <span id="result"></span></h3>

    <script src="script.js"></script>
